on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

name: CI/CD

permissions:
  contents: read

jobs:
  lint:
    name: Lint, check format and typing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyVersion: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        id: setup-uv
        with:
          enable-cache: true
          python-version: ${{ matrix.pyVersion }}
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Run ruff check
        run: uv run ruff check $(git ls-files "*.py")
      - name: Run ruff format check
        run: uv run ruff format --check $(git ls-files "*.py")
      - name: Run ty
        run: uv run ty check
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyVersion: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        id: setup-uv
        with:
          enable-cache: true
          python-version: ${{ matrix.pyVersion }}
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Run pytest w/ coverage
        run: uv run pytest --cov -vvv
  push:
    name: Push to PyPi
    runs-on: ubuntu-latest
    if: startsWith(github.event.ref, 'refs/tags/v')
    needs: [lint, test]
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        id: setup-uv
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Build
        run: uv build
      - name: Upload
        run: uv publish
